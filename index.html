<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高中題庫測驗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF1EC;
    --paper:#FFFFFF;
    --ink:#20282B;
    --sub-ink:#5B6660;
    --rule:#CBD5CE;
    --rule-strong:#9FAEA5;

    --eng:#33499A;
    --eng-soft:#E7EAF6;
    --math:#6B3FA0;
    --math-soft:#EFE6F6;
    --sci:#1B7A5C;
    --sci-soft:#E1F1EA;

    --trivia:#B5651D;
    --trivia-soft:#FBEEDD;

    --wrong:#B23A2E;
    --wrong-soft:#FBEAE7;
    --correct:#1B7A5C;
    --correct-soft:#E1F1EA;

    --stamp-red:#B23A2E;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(var(--rule) 1px, transparent 1px) 0 0/100% 34px,
      var(--bg);
    color:var(--ink);
    font-family:'Noto Sans TC','Noto Serif TC',sans-serif;
    min-height:100vh;
    padding:28px 16px 60px;
  }

  .wrap{max-width:720px;margin:0 auto;}

  .ticket{
    background:var(--paper);
    border:1.5px solid var(--ink);
    border-radius:2px;
    box-shadow:5px 5px 0 rgba(32,40,43,0.08);
    padding:0;
    margin-bottom:22px;
    overflow:hidden;
  }
  .ticket-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 20px 12px;
    border-bottom:1px dashed var(--rule-strong);
    gap:10px;
  }
  .ticket-title{
    font-family:'Noto Serif TC',serif;
    font-weight:900;
    font-size:1.5rem;
    letter-spacing:.08em;
  }
  .ticket-sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:.7rem;
    color:var(--sub-ink);
    letter-spacing:.03em;
    margin-top:2px;
  }
  .ticket-badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:.7rem;
    border:1px solid var(--ink);
    padding:4px 10px;
    border-radius:20px;
    white-space:nowrap;
    flex-shrink:0;
  }
  .ticket-fields{
    display:flex;
    padding:10px 20px 16px;
    gap:0;
  }
  .field{flex:1;padding-right:16px;}
  .field:last-child{padding-right:0;text-align:right;}
  .field-label{font-size:.68rem;color:var(--sub-ink);letter-spacing:.1em;}
  .field-value{font-family:'IBM Plex Mono',monospace;font-size:1rem;font-weight:600;margin-top:2px;}

  .subjects{display:flex;gap:10px;margin-bottom:22px;}
  .subj-tab{
    flex:1;position:relative;background:var(--paper);
    border:1.5px solid var(--ink);border-radius:2px;
    padding:16px 10px 14px;text-align:center;cursor:pointer;
    font-family:'Noto Serif TC',serif;font-weight:700;font-size:1rem;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .subj-tab:hover{transform:translateY(-2px);box-shadow:3px 4px 0 rgba(32,40,43,0.15);}
  .subj-tab small{display:block;font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:.66rem;color:var(--sub-ink);margin-top:4px;}
  .subj-tab[data-s="en"]{border-color:var(--eng);}
  .subj-tab[data-s="math"]{border-color:var(--math);}
  .subj-tab[data-s="sci"]{border-color:var(--sci);}
  .subj-tab[data-s="trivia"]{border-color:var(--trivia);}
  .subj-tab[data-s="en"] span.dot{background:var(--eng);}
  .subj-tab[data-s="math"] span.dot{background:var(--math);}
  .subj-tab[data-s="sci"] span.dot{background:var(--sci);}
  .subj-tab[data-s="trivia"] span.dot{background:var(--trivia);}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;}

  .quiz-card{
    background:var(--paper);border:1.5px solid var(--ink);border-radius:2px;
    box-shadow:5px 5px 0 rgba(32,40,43,0.08);padding:22px 22px 20px;display:none;
  }
  .quiz-card.active{display:block;animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .quiz-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;flex-wrap:wrap;gap:6px;}
  .quiz-progress{font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--sub-ink);}
  .quiz-score{font-family:'IBM Plex Mono',monospace;font-size:.78rem;font-weight:600;}

  .q-text{font-family:'Noto Serif TC',serif;font-weight:700;font-size:1.12rem;line-height:1.6;margin-bottom:18px;}
  .q-num{font-family:'IBM Plex Mono',monospace;font-weight:600;margin-right:6px;}

  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{
    display:flex;align-items:flex-start;gap:10px;
    border:1.3px solid var(--rule-strong);border-radius:3px;padding:11px 14px;
    cursor:pointer;background:var(--paper);
    transition:background .12s ease, border-color .12s ease;
  }
  .opt:hover:not(.locked){border-color:var(--ink);background:#FAFBF9;}
  .opt-label{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--sub-ink);flex-shrink:0;}
  .opt.correct-pick{background:var(--correct-soft);border-color:var(--correct);}
  .opt.wrong-pick{background:var(--wrong-soft);border-color:var(--wrong);}
  .opt.reveal-correct{background:var(--correct-soft);border-color:var(--correct);}

  .feedback{margin-top:16px;padding:12px 14px;border-radius:3px;font-size:.92rem;line-height:1.55;display:none;}
  .feedback.show{display:block;}
  .feedback.ok{background:var(--correct-soft);color:var(--correct);border:1px solid var(--correct);}
  .feedback.bad{background:var(--wrong-soft);color:var(--wrong);border:1px solid var(--wrong);}
  .feedback b{font-family:'IBM Plex Mono',monospace;}
  .steps{margin:8px 0 0;padding-left:20px;}
  .steps li{margin-bottom:4px;}

  .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap;}
  .btn{
    font-family:'Noto Sans TC',sans-serif;font-weight:700;font-size:.9rem;
    padding:10px 22px;border-radius:3px;border:1.5px solid var(--ink);
    background:var(--ink);color:var(--paper);cursor:pointer;
  }
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .btn.ghost{background:transparent;color:var(--ink);}

  .result{display:none;text-align:center;padding:10px 10px 6px;}
  .result.active{display:block;animation:fadein .3s ease;}
  .stamp{
    width:118px;height:118px;border:5px solid var(--stamp-red);border-radius:50%;
    color:var(--stamp-red);display:flex;flex-direction:column;align-items:center;justify-content:center;
    margin:6px auto 18px;transform:rotate(-8deg) scale(0.4);opacity:0;
    animation:stampin .45s cubic-bezier(.2,1.6,.4,1) .1s forwards;font-family:'Noto Serif TC',serif;
  }
  @keyframes stampin{to{transform:rotate(-8deg) scale(1);opacity:1;}}
  .stamp .num{font-size:2.1rem;font-weight:900;line-height:1;}
  .stamp .lbl{font-size:.7rem;letter-spacing:.15em;margin-top:2px;}
  .result-title{font-family:'Noto Serif TC',serif;font-weight:700;font-size:1.15rem;margin-bottom:6px;}
  .result-sub{font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:var(--sub-ink);margin-bottom:22px;}
  .review-list{text-align:left;margin:0 0 22px;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;max-height:360px;overflow-y:auto;}
  .review-item{border:1px solid var(--rule-strong);border-radius:3px;padding:10px 12px;font-size:.85rem;}
  .review-item.miss{border-color:var(--wrong);background:var(--wrong-soft);}
  .review-item .rq{font-weight:700;margin-bottom:3px;}
  .review-item .ra{font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--sub-ink);}
  .result-actions{display:flex;gap:10px;justify-content:center;}

  .hint{text-align:center;color:var(--sub-ink);font-size:.82rem;margin-top:6px;}

  .loading-card{
    background:var(--paper);border:1.5px solid var(--ink);border-radius:2px;
    box-shadow:5px 5px 0 rgba(32,40,43,0.08);padding:44px 22px;display:none;
    text-align:center;
  }
  .loading-card.active{display:block;animation:fadein .25s ease;}
  .loading-dots{
    font-family:'IBM Plex Mono',monospace;font-size:.85rem;color:var(--sub-ink);
    letter-spacing:.05em;
  }
  .loading-dots::after{
    content:'';
    animation:dots 1.2s steps(4,end) infinite;
  }
  @keyframes dots{
    0%{content:'';} 25%{content:'.';} 50%{content:'..';} 75%{content:'...';} 100%{content:'';}
  }

  @media (max-width:520px){
    .subjects{flex-direction:column;}
    .ticket-fields{flex-direction:column;gap:8px;}
    .field:last-child{text-align:left;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="ticket">
    <div class="ticket-top">
      <div>
        <div class="ticket-title">高中題庫測驗</div>
        <div class="ticket-sub">SUBJECT QUIZ TICKET · 英語/理化隨機抽題，數學無限出題並附詳解，答錯即顯示正解</div>
      </div>
      <div class="ticket-badge" id="statusBadge">請選擇科目</div>
    </div>
    <div class="ticket-fields">
      <div class="field"><div class="field-label">科　目</div><div class="field-value" id="fieldSubject">—</div></div>
      <div class="field"><div class="field-label">題　數</div><div class="field-value" id="fieldCount">—</div></div>
      <div class="field"><div class="field-label">得　分</div><div class="field-value" id="fieldScore">—</div></div>
    </div>
  </div>

  <div class="subjects" id="subjectSelect">
    <div class="subj-tab" data-s="en"><span class="dot"></span>英語<small>ENGLISH · 題庫20題，隨機抽10題</small></div>
    <div class="subj-tab" data-s="math"><span class="dot"></span>數學<small>MATH · 無限出題＋詳解</small></div>
    <div class="subj-tab" data-s="sci"><span class="dot"></span>理化<small>SCIENCE · 題庫20題，隨機抽10題</small></div>
    <div class="subj-tab" data-s="trivia"><span class="dot"></span>科普英文<small>TRIVIA · 免費線上題庫，即時抓題</small></div>
  </div>
  <div class="hint" id="topHint">點選上方科目卡片開始作答（科普英文為趣味關卡，非課綱內容，需連網）</div>

  <div class="loading-card" id="loadingCard">
    <div class="loading-dots">正在連線科普英文題庫</div>
  </div>

  <div class="quiz-card" id="quizCard">
    <div class="quiz-head">
      <div class="quiz-progress" id="progressText">第 1 / 10 題</div>
      <div class="quiz-score" id="scoreText">答對 0</div>
    </div>
    <div class="q-text"><span class="q-num" id="qNum">Q1.</span><span id="qText"></span></div>
    <div class="options" id="optionsBox"></div>
    <div class="feedback" id="feedbackBox"></div>
    <div class="actions">
      <button class="btn ghost" id="btnRestart">重新選科目</button>
      <button class="btn ghost" id="btnFinish" style="display:none;">結束並看成績</button>
      <button class="btn" id="btnNext" disabled>下一題</button>
    </div>
  </div>

  <div class="result" id="resultCard">
    <div class="stamp" id="stampBox"><div class="num" id="stampNum">0</div><div class="lbl" id="stampLbl">/ 10</div></div>
    <div class="result-title" id="resultTitle">測驗完成</div>
    <div class="result-sub" id="resultSub"></div>
    <ul class="review-list" id="reviewList"></ul>
    <div class="result-actions">
      <button class="btn ghost" id="btnAgain">再測一次</button>
      <button class="btn" id="btnSwitch">換科目</button>
    </div>
  </div>

</div>

<script>
/* ===================== 固定題庫（英語 / 理化） ===================== */
const QUESTIONS = {
  en: { name:"英語",
    list:[
      {q:"She ___ to school every day.", opts:["go","goes","going","gone"], a:1, ex:"主詞為第三人稱單數 she，一般現在式動詞需加 s，故為 goes。"},
      {q:"Look! The children ___ in the park now.", opts:["play","plays","are playing","played"], a:2, ex:"now 表示現在正在進行，用現在進行式 are playing。"},
      {q:"Water ___ at 100°C at sea level.", opts:["boil","boils","is boiling","boiled"], a:1, ex:"描述科學事實用一般現在式，主詞 water 為第三人稱單數，故用 boils。"},
      {q:"My brother usually ___ up at six every morning.", opts:["get","gets","getting","got"], a:1, ex:"usually 為頻率副詞，搭配一般現在式，主詞為第三人稱單數需加 s。"},
      {q:"I ___ TV right now; can you call back later?", opts:["watch","watches","am watching","watched"], a:2, ex:"right now 表示當下正在做的動作，用現在進行式。"},
      {q:"They ___ football every Saturday.", opts:["plays","play","playing","played"], a:1, ex:"主詞 they 為複數，一般現在式動詞不加 s，故為 play。"},
      {q:"She never ___ breakfast before school.", opts:["eat","eats","is eating","ate"], a:1, ex:"never 為頻率副詞，搭配一般現在式，第三人稱單數加 s。"},
      {q:"Listen! Someone ___ at the door.", opts:["knock","knocks","is knocking","knocked"], a:2, ex:"Listen 提示動作正在發生，用現在進行式 is knocking。"},
      {q:"The earth ___ around the sun.", opts:["move","moves","is moving","moved"], a:1, ex:"描述恆常事實用一般現在式，第三人稱單數加 s。"},
      {q:"We ___ dinner together every Friday night.", opts:["has","have","having","had"], a:1, ex:"主詞 we 為複數，一般現在式動詞不加 s，故為 have。"},
      {q:"She ___ to Japan last summer.", opts:["go","goes","went","gone"], a:2, ex:"last summer 為明確過去時間，動詞用過去式 went。"},
      {q:"While I ___ my homework, the phone rang.", opts:["do","did","was doing","have done"], a:2, ex:"背景動作用過去進行式，被打斷的動作 rang 用過去簡單式。"},
      {q:"They ___ the movie yesterday afternoon.", opts:["watch","watched","watches","were watching"], a:1, ex:"yesterday afternoon 為過去時間，動詞用過去式 watched。"},
      {q:"At 8 p.m. last night, I ___ dinner.", opts:["cook","cooked","was cooking","cooks"], a:2, ex:"描述過去某時間點正在進行的動作，用過去進行式 was cooking。"},
      {q:"He ___ his keys somewhere in the office.", opts:["lose","loses","lost","losing"], a:2, ex:"描述過去發生的單一事件，用過去式 lost。"},
      {q:"When she arrived, we ___ for two hours.", opts:["wait","waited","were waiting","have waited"], a:2, ex:"主要子句表示過去某時間點之前已持續進行的動作，用過去進行式。"},
      {q:"Did you ___ the letter this morning?", opts:["send","sent","sending","sends"], a:0, ex:"助動詞 did 後面接原形動詞，故為 send。"},
      {q:"It ___ heavily when we left the house.", opts:["rain","rains","was raining","rained"], a:2, ex:"描述過去某時間點正在進行的背景動作，用過去進行式。"},
      {q:"I ___ my grandmother last weekend.", opts:["visit","visited","visits","was visiting"], a:1, ex:"last weekend 為過去時間，動詞用過去式 visited。"},
      {q:"She ___ TV when the power went out.", opts:["watch","watched","was watching","watches"], a:2, ex:"被 the power went out 打斷的持續動作，用過去進行式 was watching。"},
      {q:"I ___ this movie three times already.", opts:["see","saw","have seen","had seen"], a:2, ex:"already 常搭配現在完成式，表示到現在為止已發生的經驗。"},
      {q:"She has just ___ her homework.", opts:["finish","finished","finishes","finishing"], a:1, ex:"has + 過去分詞為現在完成式，finish 的過去分詞為 finished。"},
      {q:"By the time he arrived, the train ___ already left.", opts:["has","had","have","was"], a:1, ex:"過去某時間點之前已完成的事，用過去完成式 had left。"},
      {q:"They ___ in this city since 2015.", opts:["live","lived","have lived","had lived"], a:2, ex:"since + 時間點，搭配現在完成式，表示動作持續至今。"},
      {q:"We had never ___ such a beautiful sunset before that trip.", opts:["see","saw","seen","seeing"], a:2, ex:"had + 過去分詞為過去完成式，see 的過去分詞為 seen。"},
      {q:"Have you ever ___ to Europe?", opts:["be","being","been","was"], a:2, ex:"Have you ever + 過去分詞，be 的過去分詞為 been。"},
      {q:"She ___ her keys, so she couldn't get in.", opts:["lose","lost","had lost","has lost"], a:2, ex:"couldn't get in 為過去事件，其發生前已完成的動作用過去完成式 had lost。"},
      {q:"I have ___ this book for two weeks, but I still haven't finished it.", opts:["borrow","borrowed","borrowing","borrows"], a:1, ex:"have + 過去分詞為現在完成式，borrow 的過去分詞為 borrowed。"},
      {q:"I think it ___ rain tomorrow.", opts:["will","is going to","would","was going to"], a:0, ex:"表示對未來的預測、判斷，常用 will。"},
      {q:"Look at those clouds! It ___ rain soon.", opts:["will","is going to","would","did"], a:1, ex:"根據現在的跡象判斷即將發生的事，用 be going to。"},
      {q:"By next year, I ___ here for ten years.", opts:["will live","have lived","will have lived","lived"], a:2, ex:"未來完成式表示「到未來某時間點為止已完成」，故為 will have lived。"},
      {q:"The meeting ___ at 3 p.m. tomorrow according to the schedule.", opts:["start","starts","is starting","will starting"], a:1, ex:"表示按照時刻表、時間表的既定未來事件，可用現在簡單式 starts。"},
      {q:"A: The phone is ringing. B: I ___ get it.", opts:["will","am going to","would","was going to"], a:0, ex:"當下臨時決定要做的事，用 will。"},
      {q:"We ___ our vacation plans next week; everything is already booked.", opts:["will discuss","are going to discuss","discuss","discussed"], a:1, ex:"已經計畫好、準備要做的未來事，用 be going to。"},
      {q:"By the time you get home, I ___ dinner.", opts:["will finish","will have finished","finish","finished"], a:1, ex:"未來完成式表示到未來某時間點之前已完成的動作。"},
      {q:"She ___ her exam results by next Friday.", opts:["will have received","receives","is receiving","received"], a:0, ex:"表示到未來某時間點前已完成的動作，用未來完成式 will have received。"},
      {q:"The book ___ by millions of readers.", opts:["reads","is read","read","has read"], a:1, ex:"書本「被閱讀」為被動語態，故為 is read。"},
      {q:"This bridge ___ in 1990.", opts:["built","was built","builds","is building"], a:1, ex:"過去被動語態為 was/were + 過去分詞，故為 was built。"},
      {q:"The letters ___ tomorrow morning.", opts:["will send","will be sent","send","are sending"], a:1, ex:"未來被動語態為 will be + 過去分詞，故為 will be sent。"},
      {q:"English ___ in many countries around the world.", opts:["speaks","is spoken","speak","spoke"], a:1, ex:"現在簡單式被動語態為 is/are + 過去分詞，故為 is spoken。"},
      {q:"The project ___ by the end of this month.", opts:["will complete","will be completed","completes","completed"], a:1, ex:"未來被動語態，主詞 project 是被完成的對象，故用 will be completed。"},
      {q:"A new hospital ___ near our school right now.", opts:["is building","is being built","builds","was built"], a:1, ex:"現在進行式被動語態為 is being + 過去分詞，故為 is being built。"},
      {q:"The window ___ by someone last night.", opts:["broke","was broken","breaks","is broken"], a:1, ex:"過去被動語態表示窗戶「被打破」，故為 was broken。"},
      {q:"These cookies ___ with fresh butter and sugar.", opts:["make","made","are made","is made"], a:2, ex:"主詞 cookies 為複數，現在簡單式被動語態為 are made。"},
      {q:"If it rains tomorrow, we ___ the picnic.", opts:["cancel","will cancel","cancelled","would cancel"], a:1, ex:"第一類條件句，if 子句用現在式，主要子句用 will + 原形動詞。"},
      {q:"If I ___ rich, I would travel around the world.", opts:["am","was","were","be"], a:2, ex:"與現在事實相反的假設語氣，be 動詞一律用 were，即使主詞是 I。"},
      {q:"If she had studied harder, she ___ the exam.", opts:["would pass","would have passed","passed","passes"], a:1, ex:"與過去事實相反的假設語氣，主要子句用 would have + 過去分詞。"},
      {q:"Water freezes if the temperature ___ below 0°C.", opts:["drops","will drop","dropped","would drop"], a:0, ex:"描述恆常事實的條件句（零類條件句），if 子句與主要子句皆用現在式。"},
      {q:"If you heat ice, it ___ into water.", opts:["turn","turns","will turn","turned"], a:1, ex:"零類條件句描述科學事實，主要子句也用現在簡單式。"},
      {q:"If I had known you were coming, I ___ a cake.", opts:["would bake","would have baked","baked","bake"], a:1, ex:"與過去事實相反的假設，主要子句用 would have + 過去分詞。"},
      {q:"If he ___ harder, he will pass the test.", opts:["study","studies","studied","will study"], a:1, ex:"第一類條件句，if 子句用現在式，主詞為第三人稱單數需加 s。"},
      {q:"She would help you if she ___ more time.", opts:["has","had","will have","have"], a:1, ex:"與現在事實相反的假設語氣，if 子句用過去式 had。"},
      {q:"This is the boy ___ dog was lost.", opts:["who","whom","whose","which"], a:2, ex:"表示所有格關係，需用 whose 連接「男孩的狗」。"},
      {q:"The man ___ is standing over there is my uncle.", opts:["who","whom","whose","which"], a:0, ex:"先行詞 the man 為人且作主詞，關係代名詞用 who。"},
      {q:"This is the house ___ I was born.", opts:["which","where","who","whom"], a:1, ex:"先行詞 the house 表地方，用關係副詞 where。"},
      {q:"I still remember the day ___ we first met.", opts:["where","which","when","who"], a:2, ex:"先行詞 the day 表時間，用關係副詞 when。"},
      {q:"The book ___ you lent me was fascinating.", opts:["who","whom","which","whose"], a:2, ex:"先行詞 the book 為事物且作受詞，關係代名詞用 which（或 that）。"},
      {q:"She is the woman ___ I met at the conference.", opts:["who","whom","whose","where"], a:1, ex:"先行詞 the woman 為人且作受詞，正式用法用 whom（口語也可用 who/that）。"},
      {q:"Students ___ work hard usually get good grades.", opts:["who","whom","which","whose"], a:0, ex:"先行詞 students 為人且作主詞，關係代名詞用 who。"},
      {q:"That's the restaurant ___ food is famous in this city.", opts:["which","who","whose","where"], a:2, ex:"表示所有格關係，需用 whose 連接「餐廳的食物」。"},
      {q:"She is afraid ___ spiders.", opts:["of","with","at","for"], a:0, ex:"be afraid of 為固定搭配，意為「害怕⋯」。"},
      {q:"I have lived here ___ 2010.", opts:["for","since","from","at"], a:1, ex:"since 接一個時間點，表示「從某時間點開始」，since 2010 意為「自2010年起」。"},
      {q:"We stayed at the hotel ___ three nights.", opts:["since","for","from","during"], a:1, ex:"for 接一段時間長度，表示「持續了多久」。"},
      {q:"The cat is hiding ___ the sofa.", opts:["under","on","above","between"], a:0, ex:"under 表示「在⋯之下」，符合貓咪躲藏的位置。"},
      {q:"She apologized ___ being late.", opts:["for","of","with","about"], a:0, ex:"apologize for 為固定搭配，意為「為⋯道歉」。"},
      {q:"He is good ___ playing the piano.", opts:["at","in","on","with"], a:0, ex:"be good at 為固定搭配，意為「擅長於⋯」。"},
      {q:"The train arrived ___ time despite the storm.", opts:["in","on","at","by"], a:1, ex:"on time 為固定片語，意為「準時」。"},
      {q:"They divided the cake ___ six equal pieces.", opts:["into","in","to","on"], a:0, ex:"divide something into 為固定搭配，意為「將某物分成⋯」。"},
      {q:"She is interested ___ learning new languages.", opts:["on","at","in","with"], a:2, ex:"be interested in 為固定搭配，意為「對⋯感興趣」。"},
      {q:"The meeting has been postponed ___ next Monday.", opts:["until","since","during","by"], a:0, ex:"postpone until 表示「延後到⋯」，為固定搭配。"},
      {q:"You ___ smoke in the hospital; it's strictly forbidden.", opts:["must not","don't have to","may not need to","can"], a:0, ex:"must not 表示強烈禁止，符合「醫院禁菸」的語意。"},
      {q:"You ___ finish the report today; tomorrow is also fine.", opts:["must","don't have to","mustn't","can't"], a:1, ex:"don't have to 表示「不必、沒有必要」，符合「明天也可以」的語意。"},
      {q:"___ I borrow your pen for a moment?", opts:["Must","Should","May","Would"], a:2, ex:"May I 為禮貌地請求許可的常見用法。"},
      {q:"He ___ be at home now; his car is in the driveway.", opts:["must","mustn't","can't","shouldn't"], a:0, ex:"根據線索做出高度肯定的推測，用 must，意為「一定」。"},
      {q:"She ___ be in the office; I just saw her at the airport.", opts:["must","can't","should","may"], a:1, ex:"根據矛盾線索做出否定推測，用 can't，意為「不可能」。"},
      {q:"You ___ see a doctor if the pain continues.", opts:["should","must","can","need"], a:0, ex:"should 表示建議，語氣比 must 溫和。"},
      {q:"When I was a child, I ___ climb trees very well.", opts:["can","could","am able to","will"], a:1, ex:"描述過去的能力，用 could。"},
      {q:"___ you help me carry these boxes, please?", opts:["Must","Could","Shall","Need"], a:1, ex:"Could you 為禮貌地請求協助的常見用法。"},
      {q:"This book is ___ than that one.", opts:["interesting","more interesting","most interesting","the most interesting"], a:1, ex:"兩者比較用比較級，多音節形容詞用 more + 原級，故為 more interesting。"},
      {q:"She is ___ student in our class.", opts:["tall","taller","the tallest","more tall"], a:2, ex:"三者以上比較最高級要加 the，單音節形容詞字尾加 est，故為 the tallest。"},
      {q:"Today is ___ than yesterday.", opts:["hot","hotter","hottest","more hot"], a:1, ex:"兩者比較用比較級，單音節形容詞字尾重複子音加 er，故為 hotter。"},
      {q:"This is ___ museum I have ever visited.", opts:["interesting","more interesting","the most interesting","most interesting"], a:2, ex:"最高級前需加 the，多音節形容詞用 the most + 原級。"},
      {q:"My sister runs ___ than I do.", opts:["fast","faster","fastest","more fast"], a:1, ex:"兩者比較用比較級，單音節副詞字尾加 er，故為 faster。"},
      {q:"Of all the students, he studies ___.", opts:["hard","harder","the hardest","more hard"], a:2, ex:"三者以上比較最高級要加 the，單音節副詞字尾加 est。"},
      {q:"Despite ___ hard, he failed the exam.", opts:["study","studying","studied","to study"], a:1, ex:"despite 後面接動名詞（V-ing），故為 studying。"},
      {q:"She enjoys ___ novels in her free time.", opts:["read","reads","reading","to read"], a:2, ex:"enjoy 後面須接動名詞（V-ing），故為 reading。"},
      {q:"They decided ___ early to avoid the traffic.", opts:["leave","leaving","left","to leave"], a:3, ex:"decide 後面須接不定詞（to V），故為 to leave。"},
      {q:"I look forward to ___ from you soon.", opts:["hear","hearing","heard","to hear"], a:1, ex:"look forward to 中的 to 為介系詞，後面須接動名詞，故為 hearing。"},
      {q:"He avoids ___ junk food to stay healthy.", opts:["eat","eating","ate","to eat"], a:1, ex:"avoid 後面須接動名詞（V-ing），故為 eating。"},
      {q:"It started ___ suddenly during the picnic.", opts:["rain","raining","to rain","rained"], a:2, ex:"start 可接動名詞或不定詞，此處以 to rain 表示動作剛開始發生較自然。"},
      {q:"\"Abundant\" 意思最接近下列何者？", opts:["scarce（稀少）","plentiful（豐富的）","tiny（微小）","broken（破損）"], a:1, ex:"abundant 意為「豐富的、充裕的」，同義字為 plentiful。"},
      {q:"\"Generous\" 的反義字為？", opts:["stingy（小氣的）","kind（親切的）","wealthy（富有的）","patient（有耐心的）"], a:0, ex:"generous 意為「慷慨的」，反義字為 stingy（小氣的）。"},
      {q:"\"Ancient\" 的反義字為？", opts:["modern（現代的）","historic（歷史的）","old（舊的）","antique（古董的）"], a:0, ex:"ancient 意為「古老的」，反義字為 modern（現代的）。"},
      {q:"\"Reluctant\" 意思最接近下列何者？", opts:["eager（渴望的）","unwilling（不情願的）","confident（自信的）","curious（好奇的）"], a:1, ex:"reluctant 意為「不情願的」，同義字為 unwilling。"},
      {q:"\"Diligent\" 意思最接近下列何者？", opts:["lazy（懶惰的）","hardworking（勤奮的）","careless（粗心的）","selfish（自私的）"], a:1, ex:"diligent 意為「勤奮的」，同義字為 hardworking。"},
      {q:"\"Enormous\" 意思最接近下列何者？", opts:["tiny（微小的）","huge（巨大的）","narrow（狹窄的）","fragile（脆弱的）"], a:1, ex:"enormous 意為「巨大的」，同義字為 huge。"},
      {q:"\"Break the ice\" 這句慣用語的意思是？", opts:["打破窗戶","破壞冰塊","化解尷尬氣氛","取消計畫"], a:2, ex:"break the ice 指在初次見面等場合「打破沉默、化解尷尬」。"},
      {q:"\"Hit the books\" 這句慣用語的意思是？", opts:["丟書","認真讀書","打架","整理書架"], a:1, ex:"hit the books 是口語慣用語，意思是「用功讀書」。"},
      {q:"下列拼字何者正確？", opts:["neccessary","necessary","necesary","neccesary"], a:1, ex:"正確拼法為 necessary，注意只有一個 c、兩個 s。"},
      {q:"\"Piece of cake\" 這句慣用語的意思是？", opts:["一塊蛋糕","非常困難","輕而易舉","浪費食物"], a:2, ex:"piece of cake 是口語慣用語，意思是「輕而易舉的事」。"}
    ]
  },
  sci:{ name:"理化",
    list:[
      {q:"牛頓第一運動定律又稱為？", opts:["慣性定律","作用力反作用力定律","萬有引力定律","能量守恆定律"], a:0, ex:"牛頓第一運動定律描述物體維持原狀態的傾向，稱為慣性定律。"},
      {q:"力、質量、加速度的關係式為？", opts:["F=ma","F=mv","F=m/a","F=a/m"], a:0, ex:"牛頓第二運動定律：F = m × a（力等於質量乘以加速度）。"},
      {q:"加速度的國際單位為？", opts:["m/s","m/s²","N","kg"], a:1, ex:"加速度定義為速度變化率，單位為公尺/秒平方（m/s²）。"},
      {q:"物體所受合力為零時，物體會處於？", opts:["加速狀態","靜止或等速直線運動","一定靜止","一定減速"], a:1, ex:"合力為零時物體維持原狀態，可能靜止也可能等速直線運動。"},
      {q:"下列何者為牛頓第三運動定律的敘述？", opts:["物體慣性大小與質量成正比","作用力與反作用力大小相等、方向相反","力等於質量乘以加速度","能量守恆不滅"], a:1, ex:"牛頓第三運動定律指作用力與反作用力大小相等、方向相反，同時發生。"},
      {q:"速度的定義為？", opts:["位移對時間的變化率","路徑長對時間的變化率","力對時間的變化率","質量對體積的比值"], a:0, ex:"速度為位移（含方向）對時間的變化率，屬於向量。"},
      {q:"下列何者是純量而非向量？", opts:["位移","速度","力","速率"], a:3, ex:"速率只有大小沒有方向，屬於純量；位移、速度、力皆為向量。"},
      {q:"物體從靜止開始等加速度運動，經過時間 t 後的速度為？", opts:["v=at","v=a/t","v=at²","v=a+t"], a:0, ex:"等加速度運動由靜止出發，末速度 v = 加速度 a × 時間 t。"},
      {q:"功的定義為？", opts:["力乘以時間","力乘以位移在力方向的分量","質量乘以速度","質量乘以加速度"], a:1, ex:"功 = 力 × 沿力方向的位移分量，單位為焦耳（J）。"},
      {q:"功率的定義為？", opts:["作功的快慢，即單位時間內所作的功","力乘以質量","位移對時間的變化率","動能對位能的比值"], a:0, ex:"功率表示作功的速率，公式為功除以時間，單位為瓦特（W）。"},
      {q:"下列何者屬於位能？", opts:["物體因高度而具有的能量","物體因運動而具有的能量","物體因溫度而具有的能量","物體因電荷而具有的能量"], a:0, ex:"重力位能是物體因所處高度而具有的能量。"},
      {q:"動能的公式為？", opts:["Ek=mv","Ek=½mv²","Ek=mgh","Ek=½mv"], a:1, ex:"動能公式為 Ek = ½mv²，其中 m 為質量，v 為速度。"},
      {q:"能量守恆定律說明能量會如何變化？", opts:["能量會憑空產生","能量只會轉換形式，總量不變","能量會逐漸消失","能量只能被創造不能被消滅"], a:1, ex:"能量守恆定律指能量可轉換形式，但總量維持不變。"},
      {q:"摩擦力的方向通常為？", opts:["與物體運動方向相同","與物體運動（或運動趨勢）方向相反","與重力方向相同","與物體運動方向垂直"], a:1, ex:"摩擦力會阻礙物體的相對運動，方向與運動或運動趨勢方向相反。"},
      {q:"自由落體運動中，物體的加速度來自於？", opts:["空氣阻力","重力加速度","彈力","摩擦力"], a:1, ex:"自由落體僅受重力作用，加速度即為重力加速度 g（約 9.8 m/s²）。"},
      {q:"電流的國際單位為？", opts:["伏特(V)","安培(A)","歐姆(Ω)","瓦特(W)"], a:1, ex:"電流的單位為安培（A），伏特是電壓單位，歐姆是電阻單位。"},
      {q:"歐姆定律的公式為？", opts:["V=IR","V=I/R","V=R/I","V=I+R"], a:0, ex:"歐姆定律：電壓 = 電流 × 電阻，即 V=IR。"},
      {q:"靜電現象中，同性電荷會如何作用？", opts:["互相吸引","互相排斥","沒有作用力","先吸引後排斥"], a:1, ex:"電荷「同性相斥，異性相吸」為基本靜電原理。"},
      {q:"電路中，電阻串聯時總電阻會如何變化？", opts:["變小","變大（等於各電阻相加）","不變","變成零"], a:1, ex:"電阻串聯時，總電阻等於各電阻相加，因此會變大。"},
      {q:"電路中，電阻並聯時總電阻會如何變化？", opts:["等於各電阻相加","比其中最小的電阻還要小","不變","變成無窮大"], a:1, ex:"電阻並聯時，總電阻的倒數等於各電阻倒數相加，總電阻會比最小的電阻還小。"},
      {q:"電功率的公式為？", opts:["P=VI","P=V/I","P=I/V","P=V+I"], a:0, ex:"電功率公式為 P = VI（電壓乘以電流），單位為瓦特（W）。"},
      {q:"家用電器上標示的「110V」代表？", opts:["電流大小","電壓大小","電阻大小","功率大小"], a:1, ex:"V 為電壓的單位符號，110V 代表電器的額定電壓為110伏特。"},
      {q:"導體與絕緣體的主要差異在於？", opts:["顏色不同","導體內有可自由移動的電子，絕緣體則無","導體一定是金屬","絕緣體不能存在於自然界"], a:1, ex:"導體內含有大量可自由移動的電子（或離子），能讓電流通過；絕緣體則幾乎沒有。"},
      {q:"下列何者是良好的電導體？", opts:["橡膠","銅","塑膠","玻璃"], a:1, ex:"銅是常見的金屬導體，具有良好的導電性；橡膠、塑膠、玻璃皆為絕緣體。"},
      {q:"電池提供電路的是？", opts:["電阻","電動勢（推動電流的能量來源）","摩擦力","磁場"], a:1, ex:"電池將化學能轉換為電能，提供電動勢以推動電路中的電流流動。"},
      {q:"電磁鐵的磁性強弱與下列何者無關？", opts:["線圈匝數","通過的電流大小","導線顏色","是否插入鐵心"], a:2, ex:"電磁鐵磁性強弱與線圈匝數、電流大小、鐵心材質有關，與導線顏色無關。"},
      {q:"發電機的主要運作原理為？", opts:["電生磁","磁生電（電磁感應）","靜電感應","光電效應"], a:1, ex:"發電機利用電磁感應原理，讓導體在磁場中運動以產生感應電流。"},
      {q:"串聯電路中，各電阻上的電流有何特性？", opts:["各處電流相同","各處電壓相同","電流會越來越小","與電阻大小無關"], a:0, ex:"串聯電路只有一條路徑，通過各元件的電流大小皆相同。"},
      {q:"並聯電路中，各支路兩端的電壓有何特性？", opts:["各支路電壓相同","各支路電流相同","電壓會相加","與電源電壓無關"], a:0, ex:"並聯電路中，各支路兩端都直接接在電源的兩端，因此電壓相同。"},
      {q:"短路是指？", opts:["電路中電阻突然變得非常大","電流未經足夠電阻直接流過，造成電流過大","電路完全斷開無電流","電壓突然降為零"], a:1, ex:"短路是電流未經應有電阻直接流通，導致電流異常增大，可能造成危險。"},
      {q:"光在真空中的速度約為？", opts:["3×10⁵ m/s","3×10⁶ m/s","3×10⁸ m/s","3×10¹⁰ m/s"], a:2, ex:"真空中光速約為 3×10⁸ 公尺/秒。"},
      {q:"在同一介質中，波速固定時，波長與頻率的關係為？", opts:["成正比","成反比","無關","相等"], a:1, ex:"波速 = 波長 × 頻率，波速固定時，波長越長頻率越低，兩者成反比。"},
      {q:"聲音在下列哪一種介質中傳播速度最快？", opts:["真空","空氣","水","鋼鐵"], a:3, ex:"聲音靠介質中粒子振動傳遞，固體分子排列緊密，聲速通常最快；真空中聲音無法傳播。"},
      {q:"光的折射現象發生在？", opts:["光經過同一介質時","光從一介質進入另一介質，傳播方向改變時","光被完全吸收時","光速不變時"], a:1, ex:"折射是光從一種介質進入另一種介質時，因傳播速度改變而使方向偏折的現象。"},
      {q:"凸透鏡對平行光線的作用為？", opts:["使光線發散","使光線平行前進不改變","使光線會聚於焦點","使光線完全反射"], a:2, ex:"凸透鏡具有會聚光線的功能，能將平行光線聚焦於焦點。"},
      {q:"聲音的高低（音調）主要取決於？", opts:["振幅","頻率","波速","介質種類"], a:1, ex:"音調高低由聲波的頻率決定，頻率越高音調越高。"},
      {q:"聲音的大小（響度）主要取決於？", opts:["頻率","波長","振幅","波速"], a:2, ex:"響度大小由聲波的振幅決定，振幅越大聲音越響。"},

/* ===================== 數學無限出題產生器 ===================== */
function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=b;b=a%b;a=t;}return a||1;}
function term(n, suffix){
  if(n===0) return '';
  const sign = n>0 ? ' + ' : ' - ';
  const abs = Math.abs(n);
  const coef = (suffix && abs===1) ? '' : String(abs);
  return `${sign}${coef}${suffix}`;
}
function fracStr(num,den){
  const g=gcd(num,den);
  let n=num/g, d=den/g;
  if(d<0){n=-n;d=-d;}
  return d===1? `${n}` : `${n}/${d}`;
}

function genLinear(){
  const a = randInt(2,9);
  let x = randInt(-9,9); if(x===0) x=3;
  const b = randInt(-15,15);
  const c = a*x + b;
  const q = `解方程式：${a}x${term(b,'')} = ${c}，x = ?`;
  const correct = `${x}`;
  const steps = [
    `移項，把常數項移到等號右邊：${a}x = ${c} ${b>=0?'-':'+'} ${Math.abs(b)}`,
    `化簡右邊：${a}x = ${a*x}`,
    `兩邊同除以 ${a}：x = ${x}`
  ];
  const distractors = [x+1, x-1, -x].map(String);
  return {q, correct, steps, distractors};
}

function genQuadraticFactor(){
  let r1, r2;
  do{
    r1 = randInt(-6,6); if(r1===0) r1=2;
    r2 = randInt(-6,6); if(r2===0) r2=-3;
  } while(r1===r2 || r1===-r2);
  const b = -(r1+r2);
  const c = r1*r2;
  const poly = `x²${term(b,'x')}${term(c,'')}`;
  const q = `解方程式：${poly} = 0，x = ?`;
  const sorted = [r1,r2].sort((x,y)=>x-y);
  const correct = `x = ${sorted[0]} 或 x = ${sorted[1]}`;
  const steps = [
    `因式分解：${poly} = (x - (${r1})) × (x - (${r2})) = 0`,
    `所以 x - (${r1}) = 0 或 x - (${r2}) = 0`,
    `解得 x = ${r1} 或 x = ${r2}`
  ];
  const alt = [ [r1, -r2], [-r1, r2], [r1+1, r2] ];
  const distractors = alt.map(p=>{
    const s=[p[0],p[1]].sort((x,y)=>x-y);
    return `x = ${s[0]} 或 x = ${s[1]}`;
  });
  return {q, correct, steps, distractors};
}

function genSlope(){
  let x1=randInt(-5,5), x2=randInt(-5,5);
  while(x2===x1) x2=randInt(-5,5);
  const y1=randInt(-5,5), y2=randInt(-5,5);
  const dy=y2-y1, dx=x2-x1;
  const correct = fracStr(dy,dx);
  const q = `已知兩點 (${x1}, ${y1}) 與 (${x2}, ${y2})，其連線斜率為？`;
  const steps=[
    `斜率公式：m = (y₂ - y₁) / (x₂ - x₁)`,
    `代入數值：m = (${y2} - (${y1})) / (${x2} - (${x1})) = ${dy} / ${dx}`,
    `化簡：m = ${correct}`
  ];
  const distractors = [ fracStr(-dy,dx), fracStr(dx,dy), fracStr(dy,dx+1===0?1:dx+1) ];
  return {q, correct, steps, distractors};
}

function genTrig(){
  const table = [
    {deg:0, sin:'0', cos:'1', tan:'0'},
    {deg:30, sin:'1/2', cos:'√3/2', tan:'√3/3'},
    {deg:45, sin:'√2/2', cos:'√2/2', tan:'1'},
    {deg:60, sin:'√3/2', cos:'1/2', tan:'√3'},
    {deg:90, sin:'1', cos:'0', tan:'不存在'}
  ];
  const row = table[randInt(0,table.length-1)];
  const funcs=['sin','cos','tan'];
  const f = funcs[randInt(0,2)];
  const correct = row[f];
  const q = `${f} ${row.deg}° 的值為？`;
  const steps=[`${row.deg}° 為常考特殊角，需熟記其三角函數值表`, `依特殊角表：${f} ${row.deg}° = ${correct}`];
  const distractors = table.filter(r=>r.deg!==row.deg).slice(0,3).map(r=>r[f]);
  return {q, correct, steps, distractors};
}

function genExponent(){
  const base=randInt(2,4);
  const m=randInt(1,4), n=randInt(1,4);
  const correctVal = Math.pow(base,m+n);
  const q = `${base}^${m} × ${base}^${n} 的值為？`;
  const steps=[
    `同底數冪相乘，指數相加：${base}^${m} × ${base}^${n} = ${base}^${m+n}`,
    `計算：${base}^${m+n} = ${correctVal}`
  ];
  const distractors = [Math.pow(base,m*n), Math.pow(base,m+n+1), Math.pow(base,m)+Math.pow(base,n)].map(String);
  return {q, correct:String(correctVal), steps, distractors};
}

function genLog(){
  const base=randInt(2,5);
  const n=randInt(1,4);
  const value=Math.pow(base,n);
  const q = `log 底 ${base}、真數 ${value} 的對數值（即 log${base}(${value})）為？`;
  const steps=[
    `log${base}(${value}) 表示「${base} 的幾次方等於 ${value}」`,
    `因為 ${base}^${n} = ${value}`,
    `所以 log${base}(${value}) = ${n}`
  ];
  const distractors = [n+1,n-1,n*2].map(String);
  return {q, correct:String(n), steps, distractors};
}

function genArithmeticSeq(){
  const a1=randInt(-5,10);
  let d=randInt(1,6); if(Math.random()<0.5) d=-d;
  const n=randInt(4,9);
  const correct=a1+(n-1)*d;
  const q=`等差數列首項 a₁=${a1}，公差 d=${d}，求第 ${n} 項 aₙ？`;
  const steps=[
    `等差數列通式：aₙ = a₁ + (n-1)d`,
    `代入：aₙ = ${a1} + (${n}-1) × ${d} = ${a1} + ${(n-1)*d}`,
    `計算：aₙ = ${correct}`
  ];
  const distractors = [correct+d, correct-d, a1+n*d].map(String);
  return {q, correct:String(correct), steps, distractors};
}

function genDiceProb(){
  const options = [
    {desc:'出現偶數點', favorable:3},
    {desc:'出現奇數點', favorable:3},
    {desc:'出現點數大於 4', favorable:2},
    {desc:'出現點數小於 3', favorable:2},
    {desc:'出現 6 的倍數', favorable:1}
  ];
  const pick= options[randInt(0,options.length-1)];
  const correct = fracStr(pick.favorable,6);
  const q=`投擲一顆公正骰子一次，${pick.desc}的機率為？`;
  const steps=[
    `骰子共有 6 種等可能結果`,
    `符合「${pick.desc}」的結果有 ${pick.favorable} 種`,
    `機率 = ${pick.favorable}/6 = ${correct}`
  ];
  const distractors = [fracStr(pick.favorable+1,6), fracStr(6-pick.favorable,6), fracStr(pick.favorable,12)];
  return {q, correct, steps, distractors};
}

function genPythagoras(){
  const triples=[[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15]];
  const t = triples[randInt(0,triples.length-1)];
  const correct = t[2];
  const q = `直角三角形兩股長分別為 ${t[0]} 與 ${t[1]}，求斜邊長？`;
  const steps=[
    `畢氏定理：斜邊² = 股₁² + 股₂²`,
    `代入：斜邊² = ${t[0]}² + ${t[1]}² = ${t[0]*t[0]} + ${t[1]*t[1]} = ${t[0]*t[0]+t[1]*t[1]}`,
    `開根號：斜邊 = √${t[0]*t[0]+t[1]*t[1]} = ${correct}`
  ];
  const distractors = [correct+1, correct-1, t[0]+t[1]].map(String);
  return {q, correct:String(correct), steps, distractors};
}

function genVertex(){
  const h=randInt(-5,5);
  const k=randInt(-6,6);
  const q = `已知函數 y = (x ${h>=0?'-':'+'} ${Math.abs(h)})² ${k>=0?'+':'-'} ${Math.abs(k)}，求其最小值？`;
  const correct = k;
  const steps=[
    `此為開口向上的拋物線，標準式 y=(x-h)²+k 的頂點座標為 (${h}, ${k})`,
    `開口向上時，頂點的 y 值即為函數最小值`,
    `所以最小值為 ${k}`
  ];
  const distractors = [h, k+1, k-1].map(String);
  return {q, correct:String(correct), steps, distractors};
}

const GENS = [genLinear, genQuadraticFactor, genSlope, genTrig, genExponent, genLog, genArithmeticSeq, genDiceProb, genPythagoras, genVertex];

function generateMathQuestion(){
  const gen = GENS[randInt(0,GENS.length-1)];
  const raw = gen();
  let distractors = [...new Set(raw.distractors.map(String))].filter(d=>d!==raw.correct).slice(0,3);
  let filler = 1;
  while(distractors.length<3){
    distractors.push(raw.correct+'?'.repeat(filler));
    filler++;
  }
  const opts = [raw.correct, ...distractors];
  for(let i=opts.length-1;i>0;i--){
    const j = randInt(0,i);
    [opts[i],opts[j]] = [opts[j],opts[i]];
  }
  const idx = opts.indexOf(raw.correct);
  return {q:raw.q, opts, a:idx, steps:raw.steps};
}

/* ===================== 固定題庫：隨機抽題＋洗牌選項 ===================== */
const ROUND_SIZE = 10;

function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = randInt(0,i);
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function shuffleOptions(item){
  const labels = item.opts.map((opt,i)=>({opt, isCorrect:i===item.a}));
  const shuffled = shuffleArray(labels);
  const newA = shuffled.findIndex(x=>x.isCorrect);
  return { q:item.q, opts:shuffled.map(x=>x.opt), a:newA, ex:item.ex };
}

function buildRandomSession(fullList){
  const picked = shuffleArray(fullList).slice(0, Math.min(ROUND_SIZE, fullList.length));
  return picked.map(shuffleOptions);
}

/* ===================== 科普趣味關卡：從免費開放題庫即時抓題 ===================== */
async function fetchTriviaQuestions(n){
  const url = `https://opentdb.com/api.php?amount=${n}&category=17&type=multiple&encode=url3986`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('網路連線失敗');
  const data = await res.json();
  if(data.response_code !== 0 || !data.results || data.results.length === 0){
    throw new Error('題庫暫時無法取得題目，請稍後再試');
  }
  return data.results.map(r=>{
    const q = decodeURIComponent(r.question);
    const correct = decodeURIComponent(r.correct_answer);
    const incorrect = r.incorrect_answers.map(x=>decodeURIComponent(x));
    const opts = shuffleArray([correct, ...incorrect]);
    const a = opts.indexOf(correct);
    return { q, opts, a, ex:'題目來源：Open Trivia Database（免費開放科普英文題庫）。' };
  });
}

/* ===================== 測驗流程 ===================== */
let state = { subj:null, mode:'fixed', idx:0, score:0, answered:false, wrongList:[], completed:0, currentItem:null };

const subjectSelect = document.getElementById('subjectSelect');
const quizCard = document.getElementById('quizCard');
const loadingCard = document.getElementById('loadingCard');
const resultCard = document.getElementById('resultCard');
const topHint = document.getElementById('topHint');
const fieldSubject = document.getElementById('fieldSubject');
const fieldCount = document.getElementById('fieldCount');
const fieldScore = document.getElementById('fieldScore');
const statusBadge = document.getElementById('statusBadge');
const btnFinish = document.getElementById('btnFinish');

document.querySelectorAll('.subj-tab').forEach(tab=>{
  tab.addEventListener('click', ()=> startQuiz(tab.dataset.s));
});
document.getElementById('btnNext').addEventListener('click', nextQuestion);
document.getElementById('btnRestart').addEventListener('click', backToSelect);
document.getElementById('btnFinish').addEventListener('click', showResult);
document.getElementById('btnAgain').addEventListener('click', ()=> startQuiz(state.subj));
document.getElementById('btnSwitch').addEventListener('click', backToSelect);

function startQuiz(subjKey){
  let mode = 'fixed';
  if(subjKey === 'math') mode = 'infinite';
  if(subjKey === 'trivia') mode = 'trivia';

  state = { subj:subjKey, mode, idx:0, score:0, answered:false, wrongList:[], completed:0, currentItem:null };
  subjectSelect.style.display='none';
  topHint.style.display='none';
  resultCard.classList.remove('active');
  quizCard.classList.remove('active');

  const s = QUESTIONS[subjKey];
  fieldSubject.textContent = s.name;

  if(mode === 'trivia'){
    fieldCount.textContent = '連線中…';
    fieldScore.textContent = '0';
    statusBadge.textContent = '連線中';
    btnFinish.style.display = 'inline-block';
    loadingCard.classList.add('active');
    fetchTriviaQuestions(ROUND_SIZE).then(list=>{
      loadingCard.classList.remove('active');
      s.sessionList = list;
      fieldCount.textContent = list.length + ' 題（即時線上題庫）';
      statusBadge.textContent = '作答中';
      quizCard.classList.add('active');
      renderQuestion();
    }).catch(err=>{
      loadingCard.classList.remove('active');
      statusBadge.textContent = '連線失敗';
      alert('科普英文題庫連線失敗：' + err.message + '\n請確認網路連線後再試一次。');
      backToSelect();
    });
    return;
  }

  if(mode === 'fixed'){
    s.sessionList = buildRandomSession(s.list);
  }
  fieldCount.textContent = mode==='infinite' ? '無限' : s.sessionList.length + ' 題（隨機抽題）';
  fieldScore.textContent = '0';
  statusBadge.textContent = '作答中';
  btnFinish.style.display = mode==='infinite' ? 'inline-block' : 'none';
  quizCard.classList.add('active');
  renderQuestion();
}

function backToSelect(){
  loadingCard.classList.remove('active');
  quizCard.classList.remove('active');
  resultCard.classList.remove('active');
  subjectSelect.style.display='flex';
  topHint.style.display='block';
  fieldSubject.textContent='—';
  fieldCount.textContent='—';
  fieldScore.textContent='—';
  statusBadge.textContent='請選擇科目';
}

function renderQuestion(){
  const s = QUESTIONS[state.subj];
  let item;
  if(state.mode === 'infinite'){
    item = generateMathQuestion();
  } else {
    item = s.sessionList[state.idx];
  }
  state.currentItem = item;
  state.answered = false;

  document.getElementById('progressText').textContent = state.mode==='infinite'
    ? `第 ${state.idx+1} 題（無限出題，可隨時結束）`
    : `第 ${state.idx+1} / ${s.sessionList.length} 題`;
  document.getElementById('scoreText').textContent = `答對 ${state.score}`;
  document.getElementById('qNum').textContent = `Q${state.idx+1}.`;
  document.getElementById('qText').textContent = item.q;

  const box = document.getElementById('optionsBox');
  box.innerHTML='';
  const labels=['A','B','C','D'];
  item.opts.forEach((opt,i)=>{
    const div = document.createElement('div');
    div.className='opt';
    div.innerHTML = `<span class="opt-label">(${labels[i]})</span><span>${opt}</span>`;
    div.addEventListener('click', ()=> selectAnswer(i));
    box.appendChild(div);
  });

  const fb = document.getElementById('feedbackBox');
  fb.classList.remove('show','ok','bad');
  fb.innerHTML='';
  document.getElementById('btnNext').disabled = true;
}

function selectAnswer(i){
  if(state.answered) return;
  state.answered = true;
  state.completed++;

  const item = state.currentItem;
  const opts = document.querySelectorAll('.opt');
  opts.forEach(o=>o.classList.add('locked'));
  const fb = document.getElementById('feedbackBox');
  const labels=['A','B','C','D'];

  if(i === item.a){
    opts[i].classList.add('correct-pick');
    state.score++;
    fb.classList.add('show','ok');
    fb.innerHTML = `<b>✓ 答對了！</b>`;
  } else {
    opts[i].classList.add('wrong-pick');
    opts[item.a].classList.add('reveal-correct');
    fb.classList.add('show','bad');
    let body = `<b>✗ 答錯了</b>　正確答案是 (${labels[item.a]}) ${item.opts[item.a]}`;
    if(item.steps && item.steps.length){
      body += `<div style="margin-top:8px;font-weight:700;">解題步驟：</div><ol class="steps">` +
        item.steps.map(st=>`<li>${st}</li>`).join('') + `</ol>`;
    } else if(item.ex){
      body += `<br>${item.ex}`;
    }
    fb.innerHTML = body;
    const correctText = item.opts ? item.opts[item.a] : '';
    state.wrongList.push({q:item.q, correct:`(${labels[item.a]}) ${correctText}`});
  }

  document.getElementById('scoreText').textContent = `答對 ${state.score}`;
  fieldScore.textContent = String(state.score);
  document.getElementById('btnNext').disabled = false;
}

function nextQuestion(){
  const s = QUESTIONS[state.subj];
  if(state.mode === 'infinite'){
    state.idx++;
    renderQuestion();
  } else {
    if(state.idx < s.sessionList.length - 1){
      state.idx++;
      renderQuestion();
    } else {
      showResult();
    }
  }
}

function showResult(){
  const s = QUESTIONS[state.subj];
  quizCard.classList.remove('active');
  resultCard.classList.add('active');
  statusBadge.textContent = '測驗完成';

  const total = state.completed;
  document.getElementById('stampNum').textContent = state.score;
  document.getElementById('stampLbl').textContent = '/ ' + total;
  document.getElementById('resultTitle').textContent = `${s.name}測驗結果`;

  const rate = total>0 ? Math.round((state.score / total) * 100) : 0;
  let comment;
  if(total===0) comment = '尚未作答任何一題。';
  else if(rate === 100) comment = '全對，非常扎實！';
  else if(rate >= 80) comment = '表現很好，再加把勁就完美了。';
  else if(rate >= 60) comment = '基礎穩定，把錯的地方再複習一次。';
  else comment = '別氣餒，把下方錯題複習清楚再挑戰一次。';
  document.getElementById('resultSub').textContent = `共作答 ${total} 題，正確率 ${rate}%　${comment}`;

  const list = document.getElementById('reviewList');
  list.innerHTML='';
  if(state.wrongList.length === 0){
    const li = document.createElement('li');
    li.className='review-item';
    li.textContent = total===0 ? '快去挑戰第一題吧！' : '這回合沒有錯題，太厲害了！';
    list.appendChild(li);
  } else {
    state.wrongList.forEach(w=>{
      const li = document.createElement('li');
      li.className='review-item miss';
      li.innerHTML = `<div class="rq">${w.q}</div><div class="ra">正解：${w.correct}</div>`;
      list.appendChild(li);
    });
  }
}
</script>
